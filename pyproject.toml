[project]
name = "aap"
version = "0.1.0"
description = "Autonomous Agent Platform — runtime que interpreta agentes definidos por datos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
]

[project.scripts]
aap = "aap.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
